name: Ensemble winter weather (GEFS, IFS ENS, GEPS)

on:
  schedule:
    # GEFS 00/06/12/18Z reach the AWS bucket ~4-5 h after cycle time.
    # GEPS 00/12Z are on the MSC datamart ~5-6 h after, IFS ENS 00/12Z on ECMWF open data ~8 h after:
    # the 08:40 and 20:40 runs are the ones that pick up the new IFS cycle and complete the three-model blend.
    - cron: "40 4,8,10,16,20,22 * * *"
  workflow_dispatch:
    inputs:
      cycle:
        description: "auto, or YYYYMMDDHH (e.g. 2026112412). IFS and GEPS only have 00/12Z: other hours are rounded down"
        default: "auto"
      max_fhr:
        description: "Last forecast hour (240 = full run; use 48 for a quick test)"
        default: "240"
      slr_mode:
        description: "Snow-to-liquid ratio: kuchera or fixed:12.5"
        default: "kuchera"
      force_refresh:
        description: "true = download this cycle again even if the live site already has it"
        default: "false"
  push:
    branches: [main]
    paths: ["pipeline/**", "tests/**", "*.js", "*.html", "*.css", "basemap_*.json", ".github/workflows/gefs.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests (Python pipeline, JS ensemble statistics)
        run: |
          python -m pytest -q tests
          node --test tests/ensstats.test.js

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false            # one model being late or down must not stop the others
      matrix:
        family: [gefs, ifs, geps]
    env:
      GEFS_WORKERS: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Build ${{ matrix.family }} products
        # Hours of this cycle that the live site already has are copied back from it, not downloaded again.
        # (Pushes that only change the viewer reuse everything; a change to the calculation code recomputes.)
        # GEFS (31 members, AWS -> GCS -> NOMADS) also keeps a 00/12Z cycle (synoptic.json) that lines up with IFS and GEPS.
        run: |
          python -m pipeline.run \
            --family ${{ matrix.family }} \
            --out "data/${{ matrix.family }}" \
            --reuse-from "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/${{ matrix.family }}" \
            ${{ github.event.inputs.force_refresh == 'true' && '--force' || '' }} \
            ${{ matrix.family == 'gefs' && '--synoptic-too' || '' }} \
            --cycle "${{ github.event.inputs.cycle || 'auto' }}" \
            --max-fhr "${{ github.event.inputs.max_fhr || '240' }}" \
            --slr-mode "${{ github.event.inputs.slr_mode || 'kuchera' }}" \
            --workers "$GEFS_WORKERS" \
            --wait-minutes 100

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}                # a run that stopped early still publishes the hours it finished
        with:
          name: data-${{ matrix.family }}
          path: data/${{ matrix.family }}
          if-no-files-found: ignore
          retention-days: 1

  assemble:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: data-*
          path: artifacts

      - name: Assemble site
        run: |
          python -m pipeline.site --out site
          for d in artifacts/data-*; do
            [ -d "$d" ] || continue
            fam="${d#artifacts/data-}"
            mkdir -p "site/data/$fam"
            cp -r "$d"/. "site/data/$fam"/
          done
          ls site/data/*/latest.json || { echo "no model produced any data"; exit 1; }
          du -sh site site/data/*

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
