name: GEFS winter weather

on:
  schedule:
    # GEFS 00/06/12/18Z cycles reach the AWS bucket ~4-5 h after cycle time; the job then waits for stragglers.
    - cron: "40 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      cycle:
        description: "auto, or YYYYMMDDHH (e.g. 2026112412)"
        default: "auto"
      max_fhr:
        description: "Last forecast hour (240 = full run; use 48 for a quick test)"
        default: "240"
      slr_mode:
        description: "Snow-to-liquid ratio: kuchera or fixed:12.5"
        default: "kuchera"
  push:
    branches: [main]
    paths: ["pipeline/**", "tests/**", "*.js", "*.html", "*.css", "basemap_*.json", ".github/workflows/gefs.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      GEFS_WORKERS: "6"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Build GEFS products (31 members, byte-range pulls, AWS -> GCS -> NOMADS)
        run: |
          python -m pipeline.run \
            --out site/data \
            --cycle "${{ github.event.inputs.cycle || 'auto' }}" \
            --max-fhr "${{ github.event.inputs.max_fhr || '240' }}" \
            --slr-mode "${{ github.event.inputs.slr_mode || 'kuchera' }}" \
            --workers "$GEFS_WORKERS" \
            --wait-minutes 100

      - name: Assemble site
        run: python -m pipeline.site --out site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
